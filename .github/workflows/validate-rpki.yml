name: Validate RPKI

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"
      timezone: "America/Los_Angeles"

permissions:
  contents: read

concurrency:
  group: rpki-pages
  cancel-in-progress: false

jobs:
  matrix:
    name: Build validator matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Generate matrix
        id: matrix
        run: python3 scripts/generate_matrix.py validators.yml >> "$GITHUB_OUTPUT"

  validate:
    name: ${{ matrix.label }}
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install observability report tooling
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y tshark

      - name: Check observability tooling
        run: |
          python3 scripts/observability.py check-tools --output "out/${{ matrix.id }}/ebpf"
          cat "out/${{ matrix.id }}/ebpf/tooling.log"

      - name: Run validator
        run: python3 scripts/run_validator.py --config validators.yml --entry-id "${{ matrix.id }}" --output "out/${{ matrix.id }}" --capture-observability || true

      - name: Ensure validator result metadata
        if: always()
        env:
          ENTRY_ID: ${{ matrix.id }}
          VALIDATOR: ${{ matrix.validator }}
          VERSION: ${{ matrix.version }}
          LABEL: ${{ matrix.label }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          out = Path("out") / os.environ["ENTRY_ID"]
          out.mkdir(parents=True, exist_ok=True)
          for name in ("stdout.log", "stderr.log"):
              (out / name).touch()
          log_events = out / "log-events.json"
          if not log_events.exists():
              log_events.write_text("[]\n", encoding="utf-8")
          (out / "docker-stats.jsonl").touch()
          default_resource_usage = {
              "sampleCount": 0,
              "sampleSpanSeconds": 0,
              "meanCpuPercent": None,
              "peakCpuPercent": None,
              "meanProcessorCores": None,
              "peakProcessorCores": None,
              "meanMemoryBytes": None,
              "peakMemoryBytes": None,
              "memoryLimitBytes": None,
              "networkRxBytes": None,
              "networkTxBytes": None,
              "meanNetworkRxBps": None,
              "meanNetworkTxBps": None,
              "peakPids": None,
          }
          resource_usage = out / "resource-usage.json"
          if not resource_usage.exists():
              resource_usage.write_text(json.dumps(default_resource_usage, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          status = out / "status.json"
          if not status.exists():
              now = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z")
              status.write_text(json.dumps({
                  "id": os.environ["ENTRY_ID"],
                  "validator": os.environ["VALIDATOR"],
                  "version": os.environ["VERSION"],
                  "label": os.environ["LABEL"],
                  "startedAt": now,
                  "finishedAt": now,
                  "durationSeconds": 0,
                  "exitCode": 70,
                  "timedOut": False,
                  "success": False,
                  "rawFiles": [],
                  "archives": [],
                  "cacheTree": None,
                  "resourceUsage": default_resource_usage,
                  "normalizationError": "validator runner exited before writing status.json"
              }, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          else:
              status_data = json.loads(status.read_text(encoding="utf-8"))
              status_data.setdefault("resourceUsage", json.loads(resource_usage.read_text(encoding="utf-8")))
              status.write_text(json.dumps(status_data, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

      - name: Upload validator result
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: validator-${{ matrix.id }}
          path: |
            out/${{ matrix.id }}/status.json
            out/${{ matrix.id }}/stdout.log
            out/${{ matrix.id }}/stderr.log
            out/${{ matrix.id }}/log-events.json
            out/${{ matrix.id }}/resource-usage.json
            out/${{ matrix.id }}/docker-stats.jsonl
            out/${{ matrix.id }}/ebpf/tooling.json
            out/${{ matrix.id }}/ebpf/tooling.log
            out/${{ matrix.id }}/ebpf/capture-status.json
            out/${{ matrix.id }}/ebpf/capture.log
            out/${{ matrix.id }}/ebpf/tcpdump.log
            out/${{ matrix.id }}/ebpf/network-tcpdump.log
            out/${{ matrix.id }}/ebpf/dns-queries.tsv
            out/${{ matrix.id }}/ebpf/network-flows.json
            out/${{ matrix.id }}/ebpf/tcp-bps.log
            out/${{ matrix.id }}/ebpf/tcp-flows.json
            out/${{ matrix.id }}/ebpf/tcp-life.log
            out/${{ matrix.id }}/ebpf/syscalls.log
            out/${{ matrix.id }}/ebpf/memory-allocations.log
            out/${{ matrix.id }}/*.log
            out/${{ matrix.id }}/normalized.json
            out/${{ matrix.id }}/cache-tree.json
            out/${{ matrix.id }}/raw/*.json.gz
          if-no-files-found: error
          retention-days: 7

  aggregate:
    name: Aggregate results
    needs: validate
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download validator results
        uses: actions/download-artifact@v8
        with:
          pattern: validator-*
          path: results

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build Pages site
        env:
          MAX_PAGES_BYTES: "996147200"
        run: |
          RUN_ID="$(date -u +'%Y%m%dT%H%M%SZ')-${{ github.run_number }}-${{ github.run_attempt }}"
          python3 scripts/aggregate_results.py --results results --site site --output public --run-id "$RUN_ID"

      - name: Upload generated file tree artifact
        uses: actions/upload-artifact@v7
        with:
          name: rpki-pages-file-tree
          path: public
          if-no-files-found: error
          retention-days: 30

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    name: Deploy GitHub Pages
    needs: aggregate
    if: ${{ always() && needs.aggregate.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
