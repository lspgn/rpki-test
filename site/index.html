<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RPKI Validator Comparisons</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1>RPKI Validator Comparisons</h1>
        <p id="subtitle">Loading validation data...</p>
      </div>
      <label class="run-picker">
        <span>Run</span>
        <select id="run-select"></select>
      </label>
    </header>

    <main>
      <section class="summary-grid" id="summary-grid"></section>

      <section class="toolbar" aria-label="Payload selector">
        <button class="tab is-active" data-payload="routeOrigins" type="button">ROA / VRP</button>
        <button class="tab" data-payload="routerKeys" type="button">BGPsec Keys</button>
        <button class="tab" data-payload="aspas" type="button">ASPA</button>
      </section>

      <section>
        <h2>Validator Runs</h2>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Validator</th>
                <th>Version</th>
                <th>Status</th>
                <th>Payload Count</th>
                <th>Unsupported</th>
                <th>Downloads</th>
              </tr>
            </thead>
            <tbody id="entries"></tbody>
          </table>
        </div>
      </section>

      <section>
        <h2>Pairwise Differences</h2>
        <div id="diffs" class="diff-list"></div>
      </section>

      <section>
        <h2>Object Presence</h2>
        <div class="table-wrap">
          <table class="presence-table">
            <thead>
              <tr>
                <th>Object</th>
                <th>Seen By</th>
                <th>Missing From</th>
              </tr>
            </thead>
            <tbody id="presence"></tbody>
          </table>
        </div>
      </section>
    </main>

    <template id="metric-template">
      <article class="metric">
        <span class="metric-label"></span>
        <strong class="metric-value"></strong>
      </article>
    </template>

    <script src="app.js"></script>
  </body>
</html>
