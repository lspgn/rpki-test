{
  "defaults": {
    "timeout_seconds": 7200,
    "payloads": {
      "routeOrigins": true,
      "routerKeys": true,
      "aspas": true
    }
  },
  "validators": [
    {
      "id": "routinator-0_15_2",
      "validator": "routinator",
      "version": "0.15.2",
      "label": "Routinator 0.15.2",
      "image": "nlnetlabs/routinator:latest@sha256:bc57d6e973c3f34fec03ef6fec09e17e405f56f084bf2252a8d54bd2ff3ca597",
      "timeout_seconds": 7200,
      "payloads": {
        "routeOrigins": true,
        "routerKeys": true,
        "aspas": true
      },
      "script": "mkdir -p /work/cache /out/raw\nroutinator --repository-dir /work/cache/repository --enable-bgpsec --enable-aspa --validation-threads=4 -vv --log-repository-issues --logfile /out/routinator.log vrps --complete -f jsonext -o /out/raw/routinator.json"
    },
    {
      "id": "rpki-client-9_8",
      "validator": "rpki-client",
      "version": "9.8",
      "label": "rpki-client 9.8",
      "image": "alpine:edge@sha256:9a341ff2287c54b86425cbee0141114d811ae69d88a36019087be6d896cef241",
      "timeout_seconds": 7200,
      "payloads": {
        "routeOrigins": true,
        "routerKeys": true,
        "aspas": true
      },
      "script": "apk add --no-cache build-base ca-certificates curl expat-dev libretls-dev musl-fts-dev openssl-dev pkgconf rsync zlib-dev\naddgroup -S _rpki-client\nadduser -S -D -H -h /nonexistent -s /sbin/nologin -G _rpki-client _rpki-client\ncurl -fsSL https://ftp.openbsd.org/pub/OpenBSD/rpki-client/rpki-client-9.8.tar.gz -o /tmp/rpki-client-9.8.tar.gz\ntar -xzf /tmp/rpki-client-9.8.tar.gz -C /tmp\ncd /tmp/rpki-client-9.8\ntest \"$(cat VERSION)\" = \"9.8\"\n./configure --prefix=/usr/local --with-rsync=rsync --with-user=_rpki-client --with-tal-dir=/usr/local/etc/rpki --with-base-dir=/work/cache --with-output-dir=/work/db\nmake -j\"$(nproc)\"\nmake install\nrpki-client -V 2>&1 | grep 'rpki-client-portable 9.8'\nmkdir -p /work/cache /work/db /out/raw\nchmod -R a+rwX /work/cache /work/db /out/raw\nrpki-client -j -d /work/cache -s 3600 /work/db\ncp /work/db/json /out/raw/rpki-client.json"
    },
    {
      "id": "fort-1_6_8",
      "validator": "fort",
      "version": "1.6.8",
      "label": "Fort 1.6.8",
      "image": "nicmx/fort-validator:latest@sha256:26766f35d0b90d61e4fb4825e10a03d66c5a249e0d9e685b1ede4a3dad23e1cd",
      "timeout_seconds": 7200,
      "payloads": {
        "routeOrigins": true,
        "routerKeys": true,
        "aspas": false
      },
      "script": "mkdir -p /work/cache /work/tals /out/raw\nfort --init-tals=true --tal=/work/tals\nfort --mode=standalone --tal=/work/tals --local-repository=/work/cache/repository --output.roa=/out/raw/fort-roas.json --output.bgpsec=/out/raw/fort-bgpsec.json --output.format=json --http.low-speed-limit=10000 --http.low-speed-time=60 --http.transfer-timeout=900 --log.output=console --log.level=info --validation-log.enabled=true --validation-log.output=console --validation-log.level=warning"
    }
  ]
}
